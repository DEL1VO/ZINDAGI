*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
img{display:block}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage / device ---------- */
.stage{height:100dvh;display:flex;align-items:center;justify-content:center;gap:110px}
.side{display:none}
.device{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:600px){
  body{background:radial-gradient(900px 500px at 15% 10%,color-mix(in srgb,var(--green) 16%,transparent),transparent 60%),radial-gradient(800px 600px at 90% 90%,color-mix(in srgb,#5b9bff 18%,transparent),transparent 60%),var(--bg)}
  .stage{height:100dvh}
  .device{width:392px;height:min(860px,calc(100dvh - 36px));border-radius:46px;box-shadow:0 0 0 10px var(--bezel),0 40px 90px -30px rgba(15,35,80,.45)}
}
@media (min-width:1080px){
  .side{display:block;width:340px}
  .side .mk{width:104px;height:auto;margin-bottom:18px}
  .side .wm{height:34px;width:auto;margin-bottom:22px}
  .side h2{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
  .side p{color:var(--muted);font-size:15px;max-width:320px}
}
.host{position:absolute;inset:0 0 calc(var(--tab-h) + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.host::-webkit-scrollbar{display:none}
.host.noTab{bottom:0}
.screen{min-height:100%;padding-bottom:28px}
.host[data-enter="1"]>.screen{animation:screenIn .26s cubic-bezier(.2,.7,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border)}
.tabbar[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.tab .pl{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--green-ink)}
.tab[aria-current="page"] .pl{background:var(--green-soft)}
.tab[aria-current="page"] svg{stroke-width:2.1}

/* ---------- generic ---------- */
.ph{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 18px) var(--pad) 12px}
.ph h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.ph-r{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:14px;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--border);flex:none;transition:transform .12s}
.ib:active{transform:scale(.94)}
.ib.sm{width:40px;height:40px;border-radius:12px;background:none;border-color:transparent;color:var(--muted)}
.ib.sm svg{width:20px;height:20px}
.ib.plain{background:none;border-color:transparent}
.pad{padding:0 var(--pad)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px var(--pad) 10px}
.sec h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sec button,.sec a{font-size:14px;font-weight:600;color:var(--green-ink);min-height:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:16px;margin:0 var(--pad) 14px}
.card.flat{padding:4px 16px}
.muted{color:var(--muted)}
.t1{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:break-word}
.t2{font-size:13px;color:var(--muted);font-weight:500}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0}
.row+.row{border-top:1px solid var(--border)}
.row.tap{width:100%}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--teal)) 15%,transparent);color:var(--c,var(--teal))}
.ico svg{width:22px;height:22px}
.amt{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in{color:var(--green-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.badge svg{width:13px;height:13px}
.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:transparent;color:var(--warn-ink)}
.badge.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);border-color:transparent;color:var(--danger-ink)}
.badge.ok{background:var(--green-soft);border-color:transparent;color:var(--green-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:600;font-size:16px;border:1px solid transparent;transition:transform .12s,background .2s,box-shadow .2s;text-align:center;line-height:1.1}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--green);color:var(--on-green);box-shadow:0 10px 22px -12px rgba(25,229,107,.95)}
.btn.soft{background:var(--green-soft);color:var(--green-ink)}
.btn.line{background:var(--surface);border-color:var(--border)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger-ink)}
.btn.blk{width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px;border-radius:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{font-weight:600;color:var(--green-ink);min-height:44px;display:inline-flex;align-items:center;padding:0 6px}
.seg{display:flex;padding:4px;border-radius:16px;background:var(--track);margin:0 var(--pad) 14px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(20,40,80,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px var(--pad) 2px}
.chips::-webkit-scrollbar{display:none}
.sheet .chips{padding:2px 0;flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);font-weight:600;font-size:14px;white-space:nowrap;flex:none;transition:border-color .15s,background .15s}
.chip svg{width:18px;height:18px}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.bar{height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w,0%);border-radius:6px;background:linear-gradient(90deg,#9BEA5C,#19E56B)}
.host[data-enter="1"] .bar>i{animation:growBar .6s cubic-bezier(.2,.7,.2,1)}
@keyframes growBar{from{width:0}}
.empty{text-align:center;padding:44px 32px;color:var(--muted)}
.empty .ei{width:72px;height:72px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-ink)}
.empty .ei svg{width:32px;height:32px}
.empty h3{color:var(--text);font-size:18px;font-weight:600;margin-bottom:6px}
.empty p{margin-bottom:18px;font-size:14px}
.fab{position:absolute;right:18px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);z-index:15;min-width:56px;height:56px;border-radius:28px;background:var(--green);color:var(--on-green);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-weight:700;box-shadow:0 14px 26px -10px rgba(14,124,107,.7);transition:transform .12s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.fab.ext{padding:0 20px 0 16px}
.fab.ext svg{width:22px;height:22px}

/* ---------- forms ---------- */
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.sheet .inp{background:var(--surface-2)}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
.inp.err{border-color:var(--danger)}
.ferr{color:var(--danger-ink);font-size:13px;font-weight:600;margin:-6px 0 12px;min-height:0}
.amtbox{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:10px 0 18px}
.amtbox input{border:0;background:none;outline:none;font-size:52px;font-weight:800;letter-spacing:-.03em;width:6.5ch;min-width:1.5ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.amtbox input::placeholder{color:var(--track)}
.amtbox span{font-size:24px;font-weight:700;color:var(--muted)}
.sh-h{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:14px}
.sh-p{color:var(--muted);font-size:14px;margin:-8px 0 16px}

/* ---------- sheets, toast ---------- */
.layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.layer.open .sheet{transform:none}
.sheet.tall{height:92%}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:2px auto 14px}
.toast{position:absolute;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:70;display:flex;align-items:center;gap:10px;background:var(--toast-bg);color:var(--toast-tx);padding:10px 16px;border-radius:16px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);width:max-content;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .tk{width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.toast .tk svg{width:14px;height:14px;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24}
.toast.show .tk svg{animation:draw .35s .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tbtn{color:var(--green);font-weight:700;min-height:32px;padding:0 4px}
:root[data-theme="light"] .tbtn{color:#19E56B}

/* ---------- hero / home ---------- */
.hero{position:relative;height:250px;background:linear-gradient(var(--h-sky1),var(--h-sky2));overflow:hidden;border-radius:0 0 34px 34px}
.hero>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .sky1,.abg .sky1{stop-color:var(--h-sky1)}.hero .sky2,.abg .sky2{stop-color:var(--h-sky2)}
.hero .sun,.abg .sun{fill:var(--h-sun)}.hero .cloud,.abg .cloud{fill:var(--h-cloud);opacity:.85}
.hero .far,.abg .far{fill:var(--h-far)}.hero .mid,.abg .mid{fill:var(--h-mid)}
.hero .b1,.abg .b1{fill:var(--h-b1)}.hero .b2,.abg .b2{fill:var(--h-b2)}.hero .b3,.abg .b3{fill:var(--h-b3)}
.hero .win,.abg .win{fill:var(--h-win);opacity:var(--h-winop)}
.appbar{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) var(--pad) 0}
.brand{display:flex;align-items:center;gap:8px;min-height:44px}
.brand .mk{height:38px;width:auto}
.brand .wm{height:17px;width:auto}
.wm-d,.dark-only{display:none}
:root[data-theme="dark"] .wm-l,:root[data-theme="dark"] .light-only{display:none}
:root[data-theme="dark"] .wm-d,:root[data-theme="dark"] .dark-only{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm-l,:root:not([data-theme="light"]) .light-only{display:none}:root:not([data-theme="light"]) .wm-d,:root:not([data-theme="light"]) .dark-only{display:block}}
.ab-r{display:flex;gap:8px;align-items:center}
.glass{background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:color-mix(in srgb,var(--surface) 60%,transparent);position:relative}
.dot{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--on-green);background:linear-gradient(135deg,#B6F26E,#19E56B);border:2px solid var(--surface);flex:none}
.avatar.lg{width:76px;height:76px;font-size:28px}
.search{position:relative;z-index:3;margin:-30px var(--pad) 0;width:calc(100% - 36px);height:60px;border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--muted);font-size:16px}
.search svg{width:22px;height:22px}
.bal{margin:16px var(--pad) 0;padding:18px;border-radius:24px;background:var(--card-grad);border:1px solid var(--border);box-shadow:var(--shadow)}
.bal-top{display:flex;align-items:center;gap:10px}
.bal-top .mk{height:26px;width:auto}
.bal-top span{font-weight:600;color:var(--muted);font-size:14px;flex:1}
.bal-num{display:flex;align-items:baseline;gap:6px;margin:8px 0 18px;font-size:clamp(32px,10vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.bal-num small{font-size:.55em;font-weight:700;color:var(--muted);letter-spacing:0}
.qas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:16px;font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--border);transition:transform .12s}
.qa:active{transform:scale(.96)}
.qa svg{width:20px;height:20px}
.qa.pri{background:var(--green);border-color:transparent;color:var(--on-green)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 var(--pad)}
.svc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 2px 12px;min-height:94px;border-radius:20px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:600;text-align:center;transition:transform .12s;position:relative}
.svc:active{transform:scale(.97)}
.svc .tl{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--tb);color:var(--tc)}
.svc .tl svg{width:26px;height:26px}
.tn-g{--tb:var(--tb-g);--tc:var(--tc-g)}.tn-t{--tb:var(--tb-t);--tc:var(--tc-t)}.tn-l{--tb:var(--tb-l);--tc:var(--tc-l)}
.tn-s{--tb:var(--tb-s);--tc:var(--tc-s)}.tn-y{--tb:var(--tb-y);--tc:var(--tc-y)}.tn-n{--tb:var(--tb-n);--tc:var(--tc-n)}
.svc .star{position:absolute;top:6px;right:6px;width:16px;height:16px;color:#E5A400;fill:currentColor}
.aic{margin:22px var(--pad) 0;padding:20px;border-radius:24px;background:var(--ai-grad);border:1px solid var(--border);position:relative;overflow:hidden}
.aic h3{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.aic h3 svg{width:20px;height:20px;color:var(--green-ink)}
.aic p{font-size:15px;max-width:66%;margin-bottom:14px;color:var(--text)}
.aic .orb{position:absolute;right:-6px;top:6px;width:132px;height:132px;pointer-events:none}
.ins{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:500;padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);margin-bottom:8px;text-align:left;width:100%}
.ins svg{width:18px;height:18px;color:var(--green-ink);margin-top:1px}

/* ---------- finance ---------- */
.fsum{margin:0 var(--pad) 14px;padding:20px;border-radius:24px;background:var(--card-grad);border:1px solid var(--border);box-shadow:var(--shadow)}
.fsum .lbl{font-size:14px;font-weight:600;color:var(--muted)}
.fsum .big{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:2px 0 14px;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pill{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--border)}
.pill .pi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.pill .pi svg{width:18px;height:18px}
.pill.in .pi{background:var(--green-soft);color:var(--green-ink)}
.pill.out .pi{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger-ink)}
.pill b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.pill small{font-size:12px;color:var(--muted);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bars{width:100%;height:auto;display:block;margin-top:6px}
.bars rect{fill:color-mix(in srgb,var(--green) 26%,var(--surface));transition:height .4s}
.bars rect.hi{fill:var(--green)}
.bars .bl{font-size:10.5px;fill:var(--muted);font-weight:600}
.bars .bv{font-size:11px;fill:var(--text);font-weight:700}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.chart-h b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.catrow{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%}
.catrow+.catrow{border-top:1px solid var(--border)}
.catrow .bar{height:6px;margin-top:6px}
.catrow .bar>i{background:var(--c)}
.donut{width:100%;max-width:210px;display:block;margin:0 auto}
.donut .dv{font-size:19px;font-weight:800;fill:var(--text)}.donut .dl{font-size:8.5px;font-weight:600;fill:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 var(--pad);margin-bottom:14px}
.kpi{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--border)}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.kpi small{color:var(--muted);font-weight:600;font-size:12.5px}
.dayh{display:flex;justify-content:space-between;padding:16px var(--pad) 4px;font-size:13px;font-weight:600;color:var(--muted)}
.list{margin:0 var(--pad);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:0 16px}

/* ---------- goals / tasks / shopping / docs / calendar ---------- */
.goal .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.goal .pc{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--green-ink)}
.goal .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin:8px 0 14px}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #B9C4D6;display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s;color:var(--on-green)}
.chk svg{width:16px;height:16px;stroke-width:3;opacity:0;transform:scale(.5);transition:opacity .15s,transform .2s}
[aria-checked="true"]>.chk{background:var(--green);border-color:var(--green)}
[aria-checked="true"]>.chk svg{opacity:1;transform:none}
.trow{display:flex;align-items:center;gap:6px;min-height:64px;padding:8px 0}
.trow+.trow{border-top:1px solid var(--border)}
.trow .main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:48px}
.done .t1{text-decoration:line-through;color:var(--muted);font-weight:500}
.prog{display:flex;align-items:center;gap:12px;margin:0 var(--pad) 14px}
.prog .bar{flex:1}
.prog span{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.additem{display:flex;gap:8px;padding:12px 0 6px;border-top:1px solid var(--border)}
.additem .inp{min-height:48px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--pad)}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.dprev{height:110px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--c);position:relative}
.dprev img{width:100%;height:100%;object-fit:cover}
.dprev svg.ic{width:38px;height:38px}
.dcard .bd{padding:12px 12px 8px;flex:1}
.dcard .t1{font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .btn{margin:0 12px 12px}
.srch{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--border);margin:0 var(--pad) 12px}
.srch input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;height:50px}
.srch svg{width:20px;height:20px;color:var(--muted)}
.srch:focus-within{border-color:var(--green)}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);margin-bottom:6px}
.cal-h b{font-size:18px;font-weight:700}
.wdr,.cgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;text-align:center}
.wdr span{font-size:12px;font-weight:600;color:var(--muted);padding:6px 0}
.cd{position:relative;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;border-radius:14px;margin:1px}
.cd.out{color:var(--muted);opacity:.55}
.cd.today{background:var(--green-soft);color:var(--green-ink)}
.cd[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.cd i{position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.cd[aria-pressed="true"] i{background:var(--green)}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.ev+.ev{border-top:1px solid var(--border)}
.ev .tm{width:52px;font-weight:700;font-size:14px;padding-top:2px;font-variant-numeric:tabular-nums}
.ev .bd{flex:1;min-width:0;border-left:3px solid var(--green);padding-left:12px}
.hr{display:flex;gap:10px;min-height:52px;border-top:1px solid var(--border);padding:6px 0}
.hr .hl{width:44px;font-size:12px;font-weight:600;color:var(--muted);padding-top:2px}
.hr .hb{flex:1;display:flex;flex-direction:column;gap:6px}
.hr .blk{background:var(--green-soft);border-left:3px solid var(--green);border-radius:10px;padding:8px 10px}
.mem{display:flex;gap:10px;overflow-x:auto;padding:0 var(--pad);scrollbar-width:none}
.mem .m{flex:none;width:92px;text-align:center;font-size:13px;font-weight:600}
.mem .avatar{margin:0 auto 6px;width:60px;height:60px;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 var(--pad)}
.tile{padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--border);min-height:118px;display:flex;flex-direction:column;gap:10px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .tl{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--tb);color:var(--tc)}
.tile b{font-size:15px;font-weight:600}
.tile small{color:var(--muted);font-size:12.5px;font-weight:500;display:block}

/* ---------- activity / messages / profile ---------- */
.tl-i{display:flex;gap:12px;padding:0 var(--pad)}
.tl-t{width:44px;font-size:13px;font-weight:600;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
.tl-r{position:relative;flex:none;width:20px}
.tl-r::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-r i{position:absolute;left:3px;top:15px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--green)}
.tl-b{flex:1;padding:8px 0}
.tl-b>div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);font-weight:500;font-size:14.5px}
.tl-b svg{width:20px;height:20px;color:var(--green-ink)}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 0;width:100%;min-height:72px}
.mrow+.mrow{border-top:1px solid var(--border)}
.unread{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--green);color:var(--on-green);font-size:12px;font-weight:700;display:grid;place-items:center}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;font-size:15px;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--green);color:var(--on-green);border-color:transparent;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.thread{display:flex;flex-direction:column;gap:8px;padding:6px var(--pad) 12px}
.pcard{margin:0 var(--pad) 16px;padding:20px;border-radius:24px;background:var(--card-grad);border:1px solid var(--border);display:flex;align-items:center;gap:16px}
.menu{margin:0 var(--pad) 14px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:0 16px}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;font-weight:500}
.mi+.mi{border-top:1px solid var(--border)}
.mi>svg:first-child{color:var(--muted)}
.mi .v{color:var(--muted);font-size:14px;font-weight:500}
.mi .cv{width:18px;height:18px;color:#B4BDCB}
.mi.out,.mi.out>svg:first-child{color:var(--danger-ink)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
[aria-checked="true"]>.sw{background:var(--green)}
[aria-checked="true"]>.sw::after{transform:translateX(20px)}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 4px;font-weight:600}
.opt+.opt{border-top:1px solid var(--border)}
.opt .rd{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid #B9C4D6;display:grid;place-items:center;color:var(--on-green)}
.opt .rd svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt[aria-checked="true"] .rd{background:var(--green);border-color:var(--green)}
.opt[aria-checked="true"] .rd svg{opacity:1}
.opt[disabled]{opacity:.5}

/* ---------- AI chat ---------- */
.chat{display:flex;flex-direction:column;height:100%}
.chat-h{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 10px}
.chat-h .lg{width:48px;height:48px;border-radius:16px;background:var(--ai-grad);border:1px solid var(--border);display:grid;place-items:center;color:var(--green-ink)}
.chat-h h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.msgs{flex:1;overflow-y:auto;padding:8px var(--pad) 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none;scroll-behavior:smooth}
.b{max-width:86%;padding:12px 14px;border-radius:20px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px}
.b.me{align-self:flex-start;align-self:flex-end;background:var(--green);color:var(--on-green);border-bottom-right-radius:6px;font-weight:500}
.b.typing{display:flex;gap:5px;padding:16px 16px}
.b.typing i{width:8px;height:8px;border-radius:50%;background:#A9B4C6;animation:dots 1s infinite}
.b.typing i:nth-child(2){animation-delay:.15s}.b.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.tool{margin-top:10px;padding:12px;border-radius:16px;background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);white-space:normal}
.tool .th{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--green-ink);font-size:14px}
.tool .th svg{width:18px;height:18px;stroke-width:2.6}
.tool .tb{font-size:14px;margin-top:4px;font-weight:500}
.tool .tr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0}
.tool .tr+.tr{border-top:1px dashed color-mix(in srgb,var(--green) 40%,transparent)}
.tool .tu{margin-top:8px;font-weight:600;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.tool .tu svg{width:16px;height:16px}
.tool .tu[disabled]{opacity:.5}
.qa-row{display:flex;gap:8px;overflow-x:auto;padding:4px var(--pad) 8px;scrollbar-width:none;flex:none}
.qa-row::-webkit-scrollbar{display:none}
.sugs{display:flex;flex-direction:column;gap:8px;align-self:flex-start;max-width:92%}
.sug{padding:10px 14px;border-radius:16px;border:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);background:color-mix(in srgb,var(--green-soft) 60%,transparent);font-size:14px;font-weight:500;min-height:44px;text-align:left}
.composer{display:flex;gap:8px;align-items:center;padding:8px 14px 12px;flex:none}
.composer .inp{border-radius:26px;min-height:52px;background:var(--surface)}
.cb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--border);transition:transform .12s}
.cb:active{transform:scale(.92)}
.cb.go{background:var(--green);border-color:transparent;color:var(--on-green)}
.cb.rec{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,77,79,.2)}}

/* ---------- auth ---------- */
.auth{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none}
.auth[hidden]{display:none}
.auth .body{padding:22px 22px calc(28px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
.auth h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.auth .lead{color:var(--muted);font-size:16px;margin-bottom:22px}
.ahero{position:relative;height:210px;flex:none}
.abg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(var(--h-sky1),var(--h-sky2));border-radius:0 0 34px 34px}
.abg>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ahero .mkt{position:absolute;left:22px;bottom:-34px;width:76px;height:76px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);z-index:2;border:1px solid var(--border)}
.ahero .mkt img{width:52px;height:auto}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--track)}
.steps i.on{background:var(--green)}
.phone{display:flex;gap:8px}
.phone .cc{display:flex;align-items:center;gap:6px;padding:0 14px;min-height:52px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;flex:none}
.tg{display:flex;gap:10px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--border);margin-bottom:18px}
.tg .ta{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--border)}
.tg .ta img{width:26px}
.tg b{font-size:14px;display:block;margin-bottom:2px}
.tg p{font-size:14px;white-space:pre-line}
.tg small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.otp input{min-width:0;height:60px;text-align:center;font-size:24px;font-weight:700;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);outline:none;font-variant-numeric:tabular-nums}
.otp input:focus{border-color:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}
.otp.err input{border-color:var(--danger)}
.otp.shake,.padwrap.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msgline{min-height:22px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:8px}
.msgline.bad,.pmsg.bad{color:var(--danger-ink)}
.dots{display:flex;gap:16px;justify-content:center;margin:26px 0 12px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #A9B4C6;transition:background .12s,border-color .12s,transform .12s}
.dots i.on{background:var(--green);border-color:var(--green);transform:scale(1.1)}
.pmsg{text-align:center;min-height:22px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:22px}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;justify-content:center}
.key{width:76px;height:76px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:28px;font-weight:600;display:grid;place-items:center;transition:transform .1s,background .1s;font-variant-numeric:tabular-nums}
.key:active{transform:scale(.93);background:var(--green-soft)}
.key.ghost{background:none;border-color:transparent}
.key.ghost svg{width:28px;height:28px}
.bioic{width:132px;height:132px;border-radius:44px;margin:26px auto 26px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-ink)}
.bioic svg{width:64px;height:64px;stroke-width:1.5}
.center{text-align:center}
.splash{position:absolute;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}
.splash.out{opacity:0;pointer-events:none}
.splash .mk{width:150px;height:auto;animation:sp 1s cubic-bezier(.2,.8,.2,1) both}
.splash .wm{height:30px;width:auto;animation:sp .8s .25s cubic-bezier(.2,.8,.2,1) both}
.splash p{color:var(--muted);font-weight:500;animation:sp .8s .45s both}
@keyframes sp{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.small{font-size:12.5px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

.screen.fill{padding-bottom:0;height:100%;min-height:0}
.catrow .bar{display:block}
.ev .t2 svg{width:14px;height:14px}
.ib[role="switch"][aria-checked="true"]{color:#E5A400}
.ib[role="switch"][aria-checked="true"] svg{fill:currentColor}
.svc .ic.star{width:16px;height:16px}
.host .thread .bub{align-self:flex-start}
.host .thread .bub.me{align-self:flex-end}

.otp input{width:100%}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.qa{padding:0 6px;font-size:13.5px;gap:6px}

.screen.fabpad{padding-bottom:100px}
.chips.scroll{flex-wrap:nowrap!important;overflow-x:auto!important;margin:0 -18px;padding:2px 18px!important}
.mrow .t1 .t2{white-space:nowrap;flex:none}
.pill b{white-space:nowrap}
.amtbox input{width:1ch}
.svc{font-size:12px;overflow:hidden}

.tab{min-width:0;overflow:hidden;padding:0 1px;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}

</style>
<style id="prem-css">
/* ---------- Premium / paywall ---------- */
.prem-hero{margin:0 var(--pad) 16px;padding:22px 20px 20px;border-radius:26px;background:var(--card-grad);border:1px solid var(--border);text-align:center}
.prem-lock{width:72px;height:72px;border-radius:24px;margin:0 auto 14px;display:grid;place-items:center;background:var(--green);color:var(--on-green);box-shadow:0 12px 26px -10px color-mix(in srgb,var(--green) 70%,transparent)}
.prem-lock svg{width:34px;height:34px}
.prem-hero h2{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:6px}
.prem-plan{color:var(--muted);font-size:14px;font-weight:500}
.prem-price{margin:14px 0 18px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.prem-price b{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.prem-price span{color:var(--muted);font-size:15px;font-weight:600}
.prem-note{margin:12px 4px 0;font-size:12.5px;color:var(--muted)}
.prem-hero.nudge{animation:premNudge .42s}
@keyframes premNudge{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prem-stat{margin:0 var(--pad) 14px;padding:12px 14px;border-radius:16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.prem-stat svg{width:20px;height:20px;flex:none}
.prem-stat span{flex:1;min-width:0}
.prem-stat.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:transparent;color:var(--warn-ink)}
.prem-stat.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:transparent;color:var(--danger-ink)}
.svc.lk .tl{filter:grayscale(.5);opacity:.7}
.lkb{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.lkb svg{width:11px;height:11px}
.tab .pl{position:relative}
.tab .lkb{top:-3px;right:6px;width:16px;height:16px}
.tab .lkb svg{width:9px;height:9px}
</style>
<style id="pwa-css">
.pwa{position:absolute;z-index:40;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:10px;padding:10px 6px 10px 10px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow),0 14px 32px -14px rgba(15,35,80,.4);transform:translateY(-150%);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s}
.pwa.on{transform:none;opacity:1}
.pwa img{width:42px;height:42px;border-radius:12px;object-fit:contain;flex:none;background:var(--surface-2)}
.pwa .pt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.pwa .pt b{font-size:14px;line-height:1.2;color:var(--text)}
.pwa .pt span{font-size:12px;line-height:1.25;color:var(--muted)}
.pwa .pgo{flex:none;min-height:42px;padding:0 15px;border-radius:13px;background:var(--green);color:var(--on-green);font-weight:700;font-size:14px;cursor:pointer}
.pwa .px{flex:none;width:38px;height:42px;border-radius:12px;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;background:none;border:0}
.pwa button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pwa-steps{margin:0 0 16px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.pwa-steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.35;color:var(--text)}
.pwa-steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
@media (display-mode:standalone){.pwa{display:none}}
@media (prefers-reduced-motion:reduce){.pwa{transition:none}}
</style>
<style id="lang-css">
.ahero{position:relative}
.langsw{position:absolute;right:14px;bottom:12px;z-index:3;display:flex;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.langsw button{min-width:42px;height:34px;padding:0 8px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer}
.langsw button[aria-pressed=true]{background:var(--green);color:var(--on-green)}
.langsw button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* как настоящее приложение: без выделения текста, зума и контекстного меню */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;overscroll-behavior:none}
input,textarea,[contenteditable=true]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none}
</style>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const num=n=>NF.format(Math.round(n*100)/100);
const pl=(n,a)=>{n=Math.abs(n)%100;const k=n%10;return I18N.t(a[(n>10&&n<20)?2:k>1&&k<5?1:k===1?0:2])};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const sum=(a,f=x=>x.amount)=>a.reduce((s,x)=>s+f(x),0);

/* dates */
const DAY=864e5,HOUR=36e5,MIN=6e4;
const pad=n=>String(n).padStart(2,'0');
const sod=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fromIso=(s,h=0,m=0)=>{const [y,mo,d]=s.split('-').map(Number);return new Date(y,mo-1,d,h,m).getTime()};
const MON=['янв.','февр.','мар.','апр.','мая','июн.','июл.','авг.','сент.','окт.','нояб.','дек.'];
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
/* язык: даты, числа и валюта подстраиваются под выбранный язык */
I18N.onChange(()=>{const c=I18N.cal();MON.splice(0,12,...c.MON);MONTHS.splice(0,12,...c.MONTHS);WD.splice(0,7,...c.WD);NF=new Intl.NumberFormat(I18N.locale(),{maximumFractionDigits:2});document.querySelectorAll('.langsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===I18N.lang)))});
const wdi=d=>(d.getDay()+6)%7;
const dayLabel=t=>{const d=sod(t),td=sod();if(d===td)return I18N.t('Сегодня');if(d===td-DAY)return I18N.t('Вчера');if(d===td+DAY)return I18N.t('Завтра');const x=new Date(t);return x.getDate()+' '+MON[x.getMonth()]};
const when=t=>dayLabel(t)+', '+hm(t);
const money=(n,{sign=false}={})=>(n<0?'−':sign&&n>0?'+':'')+num(Math.abs(n))+' с.';

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return'f'+(h>>>0).toString(16)}}

function mountPad(root,{onDone,onBio}){
  let v='',busy=false;const dots=$$('[data-dots] i',root),msg=$('[data-pmsg]',root),wrap=$('.padwrap',root)||root;
  const paint=()=>dots.forEach((d,i)=>d.classList.toggle('on',i<v.length));
  const api={setMsg(t,bad){msg.textContent=t||'';msg.classList.toggle('bad',!!bad)},reset(){v='';paint()}};
  const push=async k=>{if(busy)return;if(k==='del'){v=v.slice(0,-1);paint();return}if(v.length>=4)return;v+=k;paint();
    if(v.length===4){busy=true;const r=(await onDone(v))||{};busy=false;
      if(r.ok===false){if(!r.quiet){wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake')}api.setMsg(r.msg,!r.quiet);setTimeout(()=>{v='';paint()},r.quiet?120:260)}else if(r.reset){v='';paint()}}};

function dailyChecks(){

/* ============ Premium · подписка 20 сомони в месяц ============
   Статус подписки лежит в Firebase: premium/<telegram-id> = { until: мс }.
   Писать туда может только платёжный бот (premium-bot/bot.py) после подтверждения админом. */
const PREMIUM_PRICE=20;
const PAY_BOT='PAYMENT_ZINDAGIBOT';   /* ← username ПЛАТЁЖНОГО бота из @BotFather без @ (например: ZindagiPayBot). Это отдельный бот, не тот, что для входа */
const PREM_URL=FIREBASE_CONFIG.databaseURL+'/premium/';
const PREM_LS='zindagi.prem';
let PREM=(()=>{try{return JSON.parse(localStorage.getItem(PREM_LS))||{}}catch(e){return{}}})();
let premShown=null,premChk=0,premSeen=false,premBusy=false,premFast=0,premSig='';
const premSave=()=>{try{localStorage.setItem(PREM_LS,JSON.stringify(PREM))}catch(e){}};
/* ключ подписки — числовой Telegram ID пользователя (его же видит бот) */
const premKey=()=>{const u=DB&&DB.user;if(!u||u.demo)return null;const a=String(u.tgChat||''),b=String(u.telegramUserId||'');return /^\d{5,}$/.test(a)?a:/^\d{5,}$/.test(b)?b:null};
/* замок: включён для всех зарегистрированных без действующей подписки (демо без регистрации не блокируется) */
const isLocked=()=>{const u=DB&&DB.user;if(UI.phase!=='app'||!u||u.demo)return false;const k=premKey();return !(k&&PREM.k===k&&PREM.until>Date.now())};
const fmtD=t=>{const d=new Date(t);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
/* ссылка на бота: в start-параметр кладём телефон и имя (до 64 символов), Telegram ID бот берёт сам из чата */
function premHref(){if(!PAY_BOT)return'#';const u=DB.user||{};
  const enc=s=>{let b='';new TextEncoder().encode(s).forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
  const ph=String(u.phone||'').replace(/\D/g,'').slice(-9),nm=[...String(u.name||'').replace(/[|\r\n]/g,' ').trim()];
  let p='p'+enc(ph+'|'+nm.join(''));while(p.length>64&&nm.length){nm.pop();p='p'+enc(ph+'|'+nm.join(''))}
  return'https://t.me/'+PAY_BOT+'?start='+p}
/* смена состояния замка (оплатили / подписка закончилась) → перерисовать приложение */
function syncLock(){if(UI.phase!=='app')return;const now=isLocked();if(now===premShown)return;const was=premShown;
  closeSheet();UI.enter=true;if(!now){UI.route='home';UI.stack=[];UI.params={}}render();if(was&&!now)toast('Премиум активирован!')}
async function premRefresh(manual){const k=premKey();if(!k||premBusy)return;premBusy=true;let ok=false;
  try{const r=await fetch(PREM_URL+encodeURIComponent(k)+'.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('http_'+r.status);
    const v=await r.json();ok=true;PREM={k,until:v&&+v.until>0?+v.until:0};premSave()}
  catch(e){/* нет сети — остаётся сохранённый статус */}
  premBusy=false;premChk=Date.now();premSeen=true;
  const was=premShown;syncLock();
  if(UI.phase==='app'&&isLocked()&&was===premShown){const sig=premSeen+'|'+PREM.until;if(sig!==premSig){premSig=sig;UI.enter=false;render()}}
  if(manual){if(!ok)toast('Не удалось проверить подписку. Проверьте интернет.',{plain:true});else if(isLocked())toast('Подписка ещё не активна. Если вы уже оплатили — дождитесь подтверждения.',{plain:true})}}

/* ---- Finance ---- */
function buckets(days){
  const out=[],td=sod();
  if(days===7){for(let i=6;i>=0;i--){const s=td-i*DAY,v=sum((DB.expenses||[]).filter(e=>e.ts>=s&&e.ts<s+DAY));out.push({l:WD[wdi(new Date(s))],v,hi:i===0})}}
  else{for(let j=5;j>=0;j--){const e0=td-j*5*DAY+DAY,s0=e0-5*DAY,v=sum((DB.expenses||[]).filter(e=>e.ts>=s0&&e.ts<e0)),d=new Date(e0-DAY);out.push({l:pad(d.getDate())+'.'+pad(d.getMonth()+1),v,hi:j===0})}}
  return out}
function barsSVG(data){const W=320,H=150,max=Math.max(1,...data.map(d=>d.v)),step=(W-20)/data.length,bw=Math.min(30,step-10);
  return`<svg viewBox="0 0 ${W} ${H}" class="bars" role="img" aria-label="График расходов по периодам">${data.map((d,i)=>{const h=Math.max(5,(H-44)*d.v/max),x=10+i*step+(step-bw)/2,y=H-22-h;
    return`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(9,bw/2)}" class="${d.hi?'hi':''}"><title>${d.l}: ${num(d.v)} с.</title></rect><text x="${x+bw/2}" y="${H-6}" text-anchor="middle" class="bl">${d.l}</text>${d.hi&&d.v>0?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" class="bv">${num(d.v)}</text>`:''}`}).join('')}</svg>`}
const catRows=(rows,total)=>rows.map(r=>{const c=CATS[r.k]||CATS.other,p=Math.round(r.v/total*100);
  return`<button class="catrow" data-act="nav" data-to="expenses" data-p='{"cat":"${r.k}"}' style="--c:${c.c}"><span class="ico">${ic(c.i)}</span><span class="grow"><span class="t1" style="display:flex;justify-content:space-between;gap:8px"><span>${c.n}</span><span class="num">${num(r.v)} с.</span></span><span class="bar" role="img" aria-label="${p}% расходов"><i style="--w:${p}%"></i></span></span><span class="t2 num" style="width:38px;text-align:right">${p}%</span></button>`}).join('');
SCREENS.finance=()=>{

    <div class="pair"><div class="pill in"><span class="pi">${ic('down')}</span><div><small>Доходы</small><b>+${num(t.inc)} с.</b></div></div><div class="pill out"><span class="pi">${ic('up')}</span><div><small>Расходы</small><b>−${num(t.exp)} с.</b></div></div></div>

  let nav='',body='';
  if(c.view==='month'){
    const y=sd.getFullYear(),m=sd.getMonth(),off=wdi(new Date(y,m,1)),dim=new Date(y,m+1,0).getDate();

    const we=new Date(fromIso(days[6]));nav=`${+days[0].slice(8)} ${MON[+days[0].slice(5,7)-1]} — ${we.getDate()} ${MON[we.getMonth()]}`;

function donutSVG(parts,total){const R=54,C=2*Math.PI*R;let off=0;
  return`<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Расходы по категориям">${parts.map(p=>{const len=C*p.v/total,c=CATS[p.k]||CATS.other,s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${c.c}" stroke-width="16" stroke-dasharray="${Math.max(len-2,.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('')}<text x="70" y="68" text-anchor="middle" class="dv">${num(total)}</text><text x="70" y="82" text-anchor="middle" class="dl">с. за 30 дней</text></svg>`}
SCREENS.analytics=()=>{const ex=lastDays(DB.expenses||[],30),tot=sum(ex),rows=byCat(ex),t=totals(),rate=t.inc>0?Math.round((t.inc-t.exp)/t.inc*100):0,tasks=DB.tasks||[],done=tasks.filter(x=>x.completed).length,gs=DB.goals||[];
  const avgG=gs.length?Math.round(sum(gs,pct)/gs.length):0;
  return`<div class="screen">${head('Аналитика',{back:true})}
  <div class="kpis"><div class="kpi"><small>Тратите в день</small><b>${num(tot/30)} с.</b><small>в среднем за 30 дней</small></div><div class="kpi"><small>Остаётся от дохода</small><b>${rate}%</b><small>норма сбережений</small></div>
    <div class="kpi"><small>Задачи</small><b>${done} из ${tasks.length}</b><small>выполнено</small></div><div class="kpi"><small>Цели</small><b>${avgG}%</b><small>средний прогресс</small></div></div>
  <div class="card"><div class="t1" style="margin-bottom:10px">Куда уходят деньги</div>${rows.length?donutSVG(rows,tot)+`<div style="margin-top:10px">${catRows(rows,tot)}</div>`:'<p class="muted">Пока нет данных.</p>'}</div></div>`};

/* ============ AI assistant (tool-calling, runs locally in this prototype) ============ */
const AMT_RE=/(\d[\d\s\u00a0]*(?:[.,]\d+)?)\s*(тыс\S*|к(?![а-яё]))?/i;
const amountOf=t=>{const m=t.replace(/\d{1,2}:\d{2}/g,' ').match(AMT_RE);if(!m)return null;let n=parseFloat(m[1].replace(/[\s\u00a0]/g,'').replace(',','.'));if(m[2])n*=1000;return n>0&&isFinite(n)?n:null};
const CAT_KW=[['transport',/такси|автобус|метро|бензин|проезд|маршрутк|транспорт|парковк/],['food',/(^|\s)еду(\s|$)|еда|продукт|магазин|кафе|обед|ужин|завтрак|хлеб|молок|ресторан|фрукт|овощ|мяс|базар|рынок|кофе/],
  ['home',/аренд|квартир|коммунал|свет|газ|ремонт|мебел/],['communication',/интернет|связь|телефон|мобильн|тариф/],['technology',/ноутбук|компьютер|техник|гаджет|наушник|планшет/],
  ['education',/курс|учеб|школ|книг|репетитор|университет/],['health',/аптек|врач|лекарств|больниц|здоровь|стоматолог|анализ/],['entertainment',/кино|игр|концерт|развлеч|театр|подписк/],['shopping',/одежд|обув|куртк|покупк|платье|шопинг/]];
const guessCat=l=>{for(const[k,re]of CAT_KW)if(re.test(l))return k;return'other'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function parseWhen(l){const d=new Date();let day=false;
  const rel=l.match(/через\s+(\d+)\s*(минут\S*|мин\S*|час\S*)/);if(rel)return Date.now()+(+rel[1])*(rel[2].startsWith('ч')?HOUR:MIN);
  if(/послезавтра/.test(l)){d.setDate(d.getDate()+2);day=true}else if(/завтра/.test(l)){d.setDate(d.getDate()+1);day=true}else if(/сегодня/.test(l))day=true;
  const m=l.match(/(?:^|\s)(?:в|к)\s*(\d{1,2})(?::(\d{2}))?(?!\d)/);let h=null,mi=0;
  if(m){h=+m[1];mi=m[2]?+m[2]:0;if(/вечера|дня/.test(l)&&h<12)h+=12;if(h>23)h=null}
  if(h===null){if(!day)return null;h=9}
  d.setHours(h,mi,0,0);if(!day&&d.getTime()<Date.now())d.setDate(d.getDate()+1);return d.getTime()}
const stripWhen=s=>s.replace(/послезавтра|завтра|сегодня/gi,' ').replace(/(?:^|\s)(?:в|к)\s*\d{1,2}(?::\d{2})?(?:\s*(?:часов|часа|ч))?/gi,' ').replace(/через\s+\d+\s*\S+/gi,' ').replace(/\s+/g,' ').trim();
const noteOf=t=>{let m=t.match(/(?:^|\s)на\s+([^\d,.!?]+?)\s*(?:сегодня|вчера)?\s*[.!?]*$/i);let n=m?m[1].trim():'';
  if(!n){m=t.match(/(?:купил[а]?|заплатил[а]?\s+за|оплатил[а]?)\s+([а-яё\s]+?)\s*(?:за|\d|$)/i);n=m?m[1].trim():''}
  n=n.replace(/^(мою|мой|моё|свою)\s+/i,'');return({'еду':'Еда','обед':'Обед','ужин':'Ужин'}[n.toLowerCase()])||cap(n)};

function runAI(raw){
  raw=I18N.toRu(raw);const t=raw.trim(),l=t.toLowerCase().replace(/ё/g,'е');
  if(UI.pending){const p=UI.pending;UI.pending=null;if(/^(отмена|не надо|стоп|отменить)$/.test(l))return{text:'Хорошо, отменил.'};
    const fn={expense:()=>toolExpense(t,l),income:()=>toolIncome(t,l),task:()=>toolTask(t,l),reminder:()=>toolReminder(t,l,p),goal:()=>toolGoal(t,l,p),event:()=>toolEvent(t,l,p)}[p.tool];if(fn)return fn()}
  const a=amountOf(t);
  if(/^(привет|здравствуй|салом|добрый (день|вечер|утро))/.test(l))return{text:`Привет, ${first()}! Чем помочь?`};
  if(/что ты умеешь|что умеешь|помощь|help|как пользоваться/.test(l))return{text:HELP};
  if(/(что купить (для|на)|список (покупок )?для|ингредиент)/.test(l))return toolDish(l);
  if(/(добавь|положи|внеси)\s+.+\s+в\s+(список|покупки|корзину)/.test(l))return toolAddItem(t);
  if(a&&/(добавь|положи|внеси|пополни|отправь).*(цел[ьиюя]|копилк)/.test(l)&&!/созда/.test(l))return toolAddToGoal(t,l);
  if(/(поставь|создай|добавь|запланируй|назначь).*(встреч|событи|созвон)/.test(l))return toolEvent(t,l);
  if(/напомни/.test(l))return toolReminder(t,l);
  if(/(выполни|заверши|отметь)/.test(l))return toolComplete(t,l);
  if(/(создай|добавь|поставь|запиши).*задач|^задача(\s|$)|^(мне )?(надо|нужно)\s/.test(l))return toolTask(t,l);
  if(/(создай|поставь|добавь|хочу).*цел|накопить|накопи(\s|$)|копить/.test(l))return toolGoal(t,l);
  if(/(покажи|показать|сколько|итог|сводк|статистик|мои|что по)/.test(l)){if(/задач/.test(l))return toolTasks();if(/расход|потрат|трат/.test(l))return toolExpenseSummary(l);if(/доход|баланс|денег|финанс/.test(l))return toolFinance()}
  if(/(доход|получил|заработал|зарплат|аванс|поступил)/.test(l))return toolIncome(t,l);
  if(/(потратил|купил|заплатил|оплатил|расход|списал|отдал)/.test(l))return toolExpense(t,l);
  if(/(баланс|сколько (у меня )?(денег|осталось)|мои финансы|финанс)/.test(l))return toolFinance();
  return{text:'Пока я понимаю команды про расходы, доходы, задачи, цели, напоминания, события и покупки. Например: «Я потратил 120 сомони на еду».'}}

function changePin(){
  let step=0,cur='',nw='';const T=['Введите текущий PIN','Введите новый PIN','Повторите новый PIN'];
  openSheet(`<h2 class="sh-h center" id="cp_t">${T[0]}</h2>${padHTML()}`,{mount(sh){mountPad(sh,{onDone:async v=>{
    if(step===0){if(await sha(DB.salt+v)!==DB.pinHash)return{ok:false,msg:'Неверный PIN'};step=1;$('#cp_t',sh).textContent=T[1];return{ok:true,reset:true}}
    if(step===1){nw=v;step=2;$('#cp_t',sh).textContent=T[2];return{ok:true,reset:true}}
    if(v!==nw){step=1;$('#cp_t',sh).textContent=T[1];return{ok:false,msg:'PIN-коды не совпадают. Введите новый PIN ещё раз.'}}
    DB.pinHash=await sha(DB.salt+v);save();setTimeout(()=>{closeSheet();toast('PIN изменён')},150);return{ok:true}}})}})}

/* ---- Premium: действия ---- */
Object.assign(ACT,{
  premBuy(t,e){
    if(!PAY_BOT){e.preventDefault();toast('Платёжный бот не подключён: впишите его username в PAY_BOT в файле index.html.',{plain:true});return}
    if(!premKey()){e.preventDefault();toast('Чтобы оформить подписку, войдите через Telegram: «Выйти» → «Войти».',{plain:true});return}
    premFast=Date.now()+15*MIN;premChk=0},   /* ссылка откроется сама; дальше проверяем статус чаще */
  premCheck(){premRefresh(true)},
  premInfo(){const left=Math.max(0,Math.ceil((PREM.until-Date.now())/DAY));
    openSheet(`<h2 class="sh-h">Премиум</h2><div class="list" style="margin:0 0 14px;padding:0 14px"><div class="row" style="min-height:48px"><span class="grow muted">Действует до</span><b>${fmtD(PREM.until)}</b></div><div class="row" style="min-height:48px"><span class="grow muted">Осталось</span><b>${left} дн.</b></div></div><p class="sh-p">Новый месяц добавится к текущему сроку подписки.</p><a class="btn pri blk" href="${premHref()}" target="_blank" rel="noopener" data-act="premBuy">${ic('star')}Продлить на 1 месяц</a>`)}
});
/* проверка статуса: пока замок — каждые 15 с (после нажатия «Оформить» — каждые 4 с), с подпиской — раз в 10 минут */
setInterval(()=>{if(document.hidden||UI.phase!=='app'||!premKey())return;syncLock();
  const every=isLocked()?(premFast>Date.now()?4e3:15e3):6e5;if(Date.now()-premChk>=every)premRefresh()},2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&UI.phase==='app'&&premKey())premRefresh()});

/* ============ global events ============ */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-chips] .chip');if(c){$$('.chip',c.parentNode).forEach(x=>x.setAttribute('aria-pressed',x===c?'true':'false'));return}
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(isLocked()&&!OPEN_WHILE_LOCKED.has(a)){e.preventDefault();lockedHit();return}
  const f=ACT[a];if(f)f(t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'){const id=e.target.id;if(id==='newItem')ACT.addItem();else if(id==='famMsg')ACT.famSend();else if(id==='aiInput')ACT.aiSend()}});
document.addEventListener('input',e=>{if(e.target.id==='docQ'){UI.docQ=e.target.value;render();const i=$('#docQ');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}});

/* ============ boot ============ */
/* ============ PWA · установка как настоящего приложения ============ */
const PWA={ev:null,
  standalone(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true||(document.referrer||'').startsWith('android-app://')}catch(e){return false}},
  ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)},
  android(){return /android/i.test(navigator.userAgent)},
  inApp(){return /; wv\)|Telegram|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent)},
  hiddenUntil(){try{return +localStorage.getItem('zindagi.pwa.hide')||0}catch(e){return 0}}};
function pwaBanner(show){
  let b=$('#pwa');
  if(!show){if(b){b.classList.remove('on');setTimeout(()=>b.remove(),400)}return}
  if(b)return;
  b=document.createElement('div');b.id='pwa';b.className='pwa';b.setAttribute('role','region');b.setAttribute('aria-label','Установка приложения');
  b.innerHTML=`<img src="${MARK}" alt=""><div class="pt"><b>Установить ZINDAGI</b><span>Как обычное приложение</span></div><button class="pgo" type="button">Установить</button><button class="px" type="button" aria-label="Закрыть">×</button>`;
  $('#device').appendChild(b);void b.offsetHeight;b.classList.add('on');
  $('.pgo',b).onclick=pwaInstall;
  $('.px',b).onclick=()=>{try{localStorage.setItem('zindagi.pwa.hide',String(Date.now()+3*DAY))}catch(e){}pwaBanner(false)};
}
function pwaHelp(){
  let title='Установка приложения',body;
  if(PWA.ios()){title='Установка на iPhone';body=`<p class="sh-p">${PWA.inApp()?'Откройте эту страницу в Safari, затем:':'В Safari это делается так:'}</p><ol class="pwa-steps"><li>Нажмите кнопку «Поделиться» (квадрат со стрелкой) внизу экрана.</li><li>Выберите «На экран “Домой”».</li><li>Нажмите «Добавить» — иконка ZINDAGI появится на главном экране.</li></ol>`}
  else if(location.protocol==='file:'||!window.isSecureContext){body=`<p class="sh-p">Установка работает только по защищённому адресу (https://). Сейчас страница открыта без него, поэтому браузер не предлагает установку.</p>`}
  else if(PWA.inApp()){body=`<p class="sh-p">Вы открыли страницу во встроенном браузере. Откройте её в Chrome:</p><ol class="pwa-steps"><li>Нажмите меню ⋮ в углу экрана.</li><li>Выберите «Открыть в браузере» (Chrome).</li><li>Нажмите «Установить» ещё раз.</li></ol>`}
  else if(PWA.android()){body=`<p class="sh-p">Установите приложение через меню браузера:</p><ol class="pwa-steps"><li>Нажмите меню ⋮ в Chrome.</li><li>Выберите «Установить приложение» (или «Добавить на главный экран»).</li><li>Подтвердите установку.</li></ol><p class="sh-p">Если такого пункта нет, приложение уже установлено — найдите ZINDAGI в списке приложений.</p>`}
  else{body=`<p class="sh-p">В Chrome или Edge нажмите значок установки в адресной строке либо меню ⋮ → «Установить ZINDAGI».</p>`}
  openSheet(`<h2 class="sh-h">${title}</h2>${body}<button class="btn pri blk" data-act="closeSheet">Понятно</button>`);
}
async function pwaInstall(){
  if(PWA.standalone()){toast('Приложение уже установлено',{plain:true});return}
  const e=PWA.ev;
  if(e){PWA.ev=null;                                     /* системное окно установки Chrome (событие одноразовое) */
    try{e.prompt();const r=await e.userChoice;if(r&&r.outcome==='accepted'){pwaBanner(false);toast('Устанавливаем приложение…')}}catch(err){pwaHelp()}
    return}
  pwaHelp();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PWA.ev=e;setTimeout(pwaMaybeShow,1800)});
window.addEventListener('appinstalled',()=>{PWA.ev=null;pwaBanner(false);try{toast('Приложение установлено')}catch(e){}});
function pwaMaybeShow(){if(PWA.standalone()||Date.now()<PWA.hiddenUntil())return;pwaBanner(true)}
if(!PWA.standalone()&&(PWA.ios()||PWA.android()))setTimeout(pwaMaybeShow,2200);   /* на телефоне кнопка видна и без системного события */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ============ поведение как у настоящего приложения ============ */
(function(){
  const ed=e=>{const t=e.target;return !!(t&&t.closest&&t.closest('input,textarea,[contenteditable="true"]'))};
  ['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));   /* iOS: щипок-зум */
  document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',e=>{if(!ed(e))e.preventDefault()});
  document.addEventListener('selectstart',e=>{if(!ed(e))e.preventDefault()});
  document.addEventListener('dragstart',e=>e.preventDefault());
  ['copy','cut'].forEach(n=>document.addEventListener(n,e=>{if(!ed(e))e.preventDefault()}));
  window.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});                                   /* ПК: Ctrl + колесо */
  window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].indexOf(e.key)>-1)e.preventDefault()});
})();

function setLanguage(l){DB.lang=l;save();I18N.set(l);if(UI.phase==='app'){render();renderTabs()}}
function boot(){
  applyTheme();accSave();I18N.setCur(DB.currency||'TJS',{silent:true});I18N.set(DB.lang||I18N.detect());
  if(hasUser()){UI.phase=DB.pinHash?'lock':'app'}else UI.phase='welcome';
  if(UI.phase==='app'){render();cloudSync();premRefresh()}renderAuth();
  setTimeout(()=>{const sp=$('#splash');if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),520)},1500)}
boot();

</script>
</body>
